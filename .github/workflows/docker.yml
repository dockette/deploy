name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        include:
          - tag: "deployer8"
            context: "deployer/v8"
          - tag: "deployer7"
            context: "deployer/v7"
          - tag: "deployer6"
            context: "deployer/v6"

      fail-fast: false

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build image"
        uses: docker/build-push-action@v7
        with:
          context: "${{ matrix.context }}"
          load: true
          tags: "dockette/deploy:${{ matrix.tag }}"

      - name: "Test image"
        run: "make test-${{ matrix.tag }}"

  build:
    name: "Build"
    needs: ["test"]
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/deploy"
      tag: "${{ matrix.tag }}"
      context: "${{ matrix.context }}"
    strategy:
      matrix:
        include:
          - tag: "deployer8"
            context: "deployer/v8"
          - tag: "deployer7"
            context: "deployer/v7"
          - tag: "deployer6"
            context: "deployer/v6"

      fail-fast: false

  docs:
    name: "Docs"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/deploy"
